# profiles.yml
# dbt connection profile for PostgreSQL/Neon.
#
# Credentials are read from environment variables in .env.
# The Makefile loads .env before running dbt commands.

job_market_profile:
  target: dev

  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'dev') }}"
      threads: 4
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'require') }}"

    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'prod') }}"
      threads: 4
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'require') }}"