# pyproject.toml
# Python packaging configuration for the Job Market Analytics Warehouse.


[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-warehouse"
version = "0.1.0"
description = "A data engineering project for live job market analytics using Adzuna, PostgreSQL, and dbt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.8,<2.0",
    "dbt-postgres>=1.8,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "tenacity>=8.2,<10.0",
    "pydantic>=2.0,<3.0",
    "rich>=13.0,<15.0",
]

[tool.setuptools]
package-dir = {"" = "ingestion/src"}

[tool.setuptools.packages.find]
where = ["ingestion/src"]