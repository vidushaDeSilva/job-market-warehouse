name: Run Job Market Warehouse Pipeline

on:
  schedule:
    # GitHub Actions cron is in UTC.
    # This runs daily at 05:30 UTC.
    - cron: "30 5 * * *"

  workflow_dispatch:

jobs:
  run-pipeline:
    name: Run orchestrated data pipeline
    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      APP_ENV: dev

      # Database connection.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SSLMODE: require

      # dbt target/schema.
      DBT_SCHEMA: dev
      ORCHESTRATOR_DBT_TARGET: dev

      # Adzuna credentials.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      # Adzuna reliability settings.
      ADZUNA_TIMEOUT_SECONDS: 30
      ADZUNA_MAX_RETRIES: 3
      ADZUNA_RETRY_BACKOFF_INITIAL_SECONDS: 5
      ADZUNA_RETRY_BACKOFF_MAX_SECONDS: 60
      ADZUNA_REQUEST_PAUSE_SECONDS: 1

      # Orchestration metadata.
      ORCHESTRATOR_PIPELINE_NAME: job_market_warehouse_pipeline
      ORCHESTRATOR_TRIGGER_TYPE: CI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Initialize database
        run: |
          make db-init

      - name: Run orchestrated pipeline
        run: |
          make orchestrated-pipeline

      - name: Validate orchestration
        run: |
          make sprint13-check

      - name: Upload dbt logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-logs
          path: |
            dbt_job_market/logs
            dbt_job_market/target
          if-no-files-found: ignore